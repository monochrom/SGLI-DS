<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button – SGLI</title>
  <link rel="stylesheet" href="../../styles/index.css">
  <link rel="stylesheet" href="./button.css">
  <link rel="stylesheet" href="../preview.css">
</head>
<body>
  <main class="preview">
    <h1 class="text-h3">Button</h1>
    <p class="preview__meta">Figma: Button/Primary · Button/Secondary · Button/Icon. Fenster unter 1024 px zeigt Size=Mobile.</p>

    <section class="preview__block">
      <h2 class="text-label-s">Primary</h2>
      <div class="preview__row">
        <button class="btn btn--primary" type="button">Button Label</button>
        <button class="btn btn--primary is-hover" type="button">Hover</button>
        <button class="btn btn--primary is-active" type="button">Pressed</button>
        <button class="btn btn--primary" type="button" disabled>Disabled</button>
        <a class="btn btn--primary" href="#">Als Link</a>
      </div>
    </section>

    <section class="preview__block">
      <h2 class="text-label-s">Secondary</h2>
      <div class="preview__row">
        <button class="btn btn--secondary" type="button">Button Label</button>
        <button class="btn btn--secondary is-hover" type="button">Hover</button>
        <button class="btn btn--secondary is-active" type="button">Pressed</button>
        <button class="btn btn--secondary" type="button" disabled>Disabled</button>
        <a class="btn btn--secondary" href="#">Als Link</a>
      </div>
    </section>

    <section class="preview__block">
      <h2 class="text-label-s">Icon</h2>
      <div class="preview__row">
        <button class="btn btn--icon" type="button" aria-label="Weiter"><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-ArrowRight"></use></svg></button>
        <button class="btn btn--icon is-hover" type="button" aria-label="Weiter"><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-ArrowRight"></use></svg></button>
        <button class="btn btn--icon is-active" type="button" aria-label="Weiter"><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-ArrowRight"></use></svg></button>
        <button class="btn btn--icon" type="button" aria-label="Weiter" disabled><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-ArrowRight"></use></svg></button>
        <button class="btn btn--icon" type="button" aria-label="Zurück"><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-ArrowLeft"></use></svg></button>
        <button class="btn btn--icon" type="button" aria-label="Schließen"><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-X"></use></svg></button>
      </div>
    </section>

    <section class="preview__block">
      <h2 class="text-label-s">Fokus (Tab drücken)</h2>
      <div class="preview__row">
        <button class="btn btn--primary" type="button">Primary</button>
        <button class="btn btn--secondary" type="button">Secondary</button>
        <button class="btn btn--icon" type="button" aria-label="Weiter"><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-ArrowRight"></use></svg></button>
      </div>
    </section>

    <section class="preview__block">
      <h2 class="text-label-s">In allen Kontexten</h2>
      <div class="preview__contexts" data-preview-contexts>
        <template>
          <button class="btn btn--primary" type="button">Primary</button>
          <button class="btn btn--secondary" type="button">Secondary</button>
          <button class="btn btn--icon" type="button" aria-label="Weiter"><svg class="icon" aria-hidden="true"><use href="../../../dist/icons/sprite.svg#icon-ArrowRight"></use></svg></button>
        </template>
      </div>
    </section>
  </main>
  <script src="../preview.js"></script>
</body>
</html>
